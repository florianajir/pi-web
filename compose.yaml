      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.priority=10"
      - "traefik.http.routers.nextcloud-public.rule=Host(`nextcloud.${HOST_NAME:-pi.lan}`) && (PathPrefix(`/s/`) || PathPrefix(`/public.php`) || PathPrefix(`/avatar/`) || PathPrefix(`/dist/`) || PathPrefix(`/apps/`) || PathPrefix(`/js/`) || PathPrefix(`/core/`) || PathPrefix(`/themes/`) || PathPrefix(`/remote.php/dav/calendars/`) || PathPrefix(`/remote.php/dav/public-calendars/`))"
      - "traefik.http.routers.nextcloud-public.entrypoints=websecure"
      - "traefik.http.routers.nextcloud-public.middlewares=frame-deny@docker"
      - "traefik.http.routers.nextcloud-public.tls=true"
      - "traefik.http.routers.nextcloud-public.priority=20"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      start_period: 60s
      start_interval: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpuset: "1-3"
    deploy: *cpu-request-large
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  homepage:
    <<: *service-defaults
    image: ghcr.io/gethomepage/homepage:v2.1.2@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60
    container_name: pi-homepage
    networks:
      - frontend
    expose:
      - 3000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - HOMEPAGE_ALLOWED_HOSTS=homepage.${HOST_NAME:-pi.lan}
      # Read by widget labels as {{HOMEPAGE_VAR_x}}.
      - HOMEPAGE_VAR_ADMIN_USER=${ADMIN_USER:-admin}
      - HOMEPAGE_VAR_ADMIN_PASSWORD=${PASSWORD}
      # NEXTCLOUD_ADMIN_USER only applies at first install, where it resolved to
      # $EMAIL - so that, not the current $ADMIN_USER, is the account that exists.
      - HOMEPAGE_VAR_NEXTCLOUD_USER=${EMAIL}
      # Read by widget labels as {{HOMEPAGE_FILE_x}}; written by
      # scripts/homepage-widgets-bootstrap.sh into the mounted config dir.
      - HOMEPAGE_FILE_PROWLARR_API_KEY=/app/config/secrets/prowlarr_api_key
      - HOMEPAGE_FILE_KAVITA_API_KEY=/app/config/secrets/kavita_api_key
      - HOMEPAGE_FILE_HEADSCALE_API_KEY=/app/config/secrets/headscale_api_key
      - HOMEPAGE_FILE_HEADSCALE_NODE_ID=/app/config/secrets/headscale_node_id
      # Immich is the one key nothing can mint: its admin password is set at signup
      # and is not derivable from .env, and api_key.key is stored hashed, so neither
      # the API nor the database can produce one. Paste it into the secret file --
      # scripts/homepage-widgets-bootstrap.sh creates it empty on first run.
      - HOMEPAGE_FILE_IMMICH_API_KEY=/app/config/secrets/immich_api_key
    extra_hosts:
      # So the widget's https:// call passes Nextcloud's trusted-domains check.
      - "nextcloud.${HOST_NAME:-pi.lan}:172.30.11.250"
    volumes:
      - ./config/homepage:/app/config
      # /app/public is the only path homepage serves over HTTP (/api/config is
      # hardcoded to custom.css and custom.js), so local icons have to live here.
      - ./config/homepage/icons:/app/public/icons:ro
      # Overriding the files the server-rendered HTML points at, rather than
      # `favicon:` in settings.yaml, which only applies after hydration and left
      # the tab flickering. Regenerate from docs/assets/logo.png with
      # scripts/homepage-favicon.sh.
      - ./config/homepage/icons/favicon.ico:/app/public/favicon.ico:ro
      - ./config/homepage/icons/favicon-16x16.png:/app/public/favicon-16x16.png:ro
      - ./config/homepage/icons/favicon-32x32.png:/app/public/favicon-32x32.png:ro
      - ./config/homepage/icons/homepage.ico:/app/public/homepage.ico:ro
      - ./config/homepage/icons/apple-touch-icon.png:/app/public/apple-touch-icon.png:ro
      - ./config/homepage/icons/safari-pinned-tab.svg:/app/public/safari-pinned-tab.svg:ro
      - ./config/homepage/icons/android-chrome-192x192.png:/app/public/android-chrome-192x192.png:ro
      - ./config/homepage/icons/android-chrome-512x512.png:/app/public/android-chrome-512x512.png:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
    tmpfs:
      - /app/config/logs
    labels:
      - "homepage.group=Dashboard"
      - "homepage.name=Homepage"
      # The one tile that stands for this stack rather than a third-party app, so
      # it uses the pi-pcloud mark from the icons mount instead of dashboard-icons.
      - "homepage.icon=/icons/logo.png"
      - "homepage.href=https://homepage.${HOST_NAME:-pi.lan}"
      - "homepage.description=Service dashboard"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
    depends_on:
      - traefik
    deploy: *cpu-request-small
    mem_limit: 192m
    oom_score_adj: *oom-score-deprioritize

  gluetun:
    <<: *service-defaults
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: pi-gluetun
    profiles: ["gluetun", "qbittorrent", "stremio", "kapowarr", "all"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - frontend
    expose:
      - 8080
      - 11470
      - 12470
      - 5656
      - 8000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Grants the Homepage widget unauthenticated read access to a couple of
      # harmless routes (public IP, port-forward status) - see the file for details.
      - HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH=/gluetun/custom/auth-config.toml
    env_file:
      - path: ./config/gluetun/gluetun.env
        required: false
    volumes:
      - ${DATA_LOCATION:-./data}/gluetun:/gluetun
      - ./config/gluetun:/gluetun/custom:ro
    labels:
      - "homepage.group=Privacy"
      - "homepage.name=Gluetun"
      - "homepage.icon=gluetun.png"
      - "homepage.href=https://gluetun.${HOST_NAME:-pi.lan}"
      - "homepage.description=VPN client"
      - "homepage.widget.type=gluetun"
      - "homepage.widget.url=http://pi-gluetun:8000"
      - "homepage.widget.version=2"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "traefik.http.routers.kapowarr.rule=Host(`kapowarr.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.kapowarr.entrypoints=websecure"
      - "traefik.http.routers.kapowarr.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.kapowarr.tls=true"
      - "traefik.http.routers.kapowarr.service=kapowarr"
      - "traefik.http.services.kapowarr.loadbalancer.server.port=5656"
      - "traefik.http.routers.stremio-root.rule=Host(`stremio.${HOST_NAME:-pi.lan}`) && Path(`/`)"
      - "traefik.http.routers.stremio-root.entrypoints=websecure"
      - "traefik.http.routers.stremio-root.middlewares=frame-deny@docker,lan@docker,stremio-webui-redirect@docker"
      - "traefik.http.routers.stremio-root.priority=30"
      - "traefik.http.routers.stremio-root.tls=true"
      - "traefik.http.routers.stremio-root.service=noop@internal"
      # No authelia, same reason as comet below: a cast receiver fetches the stream
      # itself and cannot pass an interactive SSO login. It was also denying every client
      # including the LAN, since stremio.<HOST_NAME> has no access_control rule and
      # Authelia's default_policy is deny.
      - "traefik.http.routers.stremio.rule=Host(`stremio.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.stremio.entrypoints=websecure"
      - "traefik.http.routers.stremio.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.stremio.priority=10"
      - "traefik.http.routers.stremio.tls=true"
      - "traefik.http.routers.stremio.service=stremio"
      - "traefik.http.services.stremio.loadbalancer.server.port=11470"
      - "traefik.http.middlewares.stremio-webui-redirect.redirectregex.regex=^https?://([^/]+)/?$"
      - "traefik.http.middlewares.stremio-webui-redirect.redirectregex.replacement=https://app.strem.io/shell-v4.4/?streamingServer=https%3A%2F%2F$${1}"
      - "traefik.http.middlewares.stremio-webui-redirect.redirectregex.permanent=false"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      start_period: 30s
      start_interval: 5s
    deploy: *cpu-request-small
    mem_limit: 256m
    oom_score_adj: *oom-score-deprioritize

  qbittorrent:
    <<: *service-defaults
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls474@sha256:a00b6a597a3832a1814cde0ef60abc55c94644f3f80902c3432f6af6de8d4a96
    container_name: pi-qbittorrent
    profiles: ["qbittorrent", "all"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "homepage.group=Download"
      - "homepage.name=qBittorrent"
      - "homepage.icon=qbittorrent.png"
      - "homepage.href=https://qbittorrent.${HOST_NAME:-pi.lan}"
      - "homepage.description=Torrent client (VPN protected)"
      - "homepage.widget.type=qbittorrent"
      - "homepage.widget.url=http://pi-gluetun:8080"
      - "homepage.widget.username={{HOMEPAGE_VAR_ADMIN_USER}}"
      - "homepage.widget.password={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${DATA_LOCATION:-./data}/qbittorrent:/config
      - ${DATA_LOCATION:-./data}/download:/downloads
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      start_period: 30s
    deploy: *cpu-request-small
    mem_limit: 256m
    oom_score_adj: *oom-score-deprioritize

  stremio:
    <<: *stremio-common
    container_name: pi-stremio
    profiles: ["stremio", "all"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      # Routed by gluetun's labels: sharing its namespace leaves this container
      # with no address of its own for Traefik's docker provider to target.
      - "traefik.enable=false"
      - "homepage.group=Video"
      - "homepage.name=Stremio"
      - "homepage.icon=stremio.png"
      - "homepage.href=https://stremio.${HOST_NAME:-pi.lan}"
      - "homepage.description=Streaming server (VPN protected)"

  # Casting alternative to `stremio` above, never both: the conflicts-with label
  # below is what services.sh, the picker and stack-up.sh all read to refuse it.
  # Discovery is SSDP/mDNS multicast, which reaches no renderer from a Docker
  # bridge and which gluetun's firewall rejects outright (EPERM on 239.255.255.250),
  # so a cast-capable server needs its own address on the physical LAN. That
  # address is off the VPN: torrent pieces Stremio fetches itself then leave on
  # the residential IP, which is a real trade-off when not using a debrid addon.
  stremio-lan:
    <<: *stremio-common
    container_name: pi-stremio-lan
    profiles: ["stremio-lan"]
    networks:
      frontend: {}
      lan:
        ipv4_address: ${STREMIO_IP:-192.168.1.251}
    # A macvlan child cannot reach its own parent host, so the public records
    # pointing these names at HOST_LAN_IP are unusable here: reach Traefik on
    # the frontend network instead, or upstream fetches fail with EHOSTUNREACH.
    extra_hosts:
      - "stremio.${HOST_NAME:-pi.lan}:172.30.11.250"
      - "comet.${HOST_NAME:-pi.lan}:172.30.11.250"
    labels:
      - "homepage.group=Video"
      - "homepage.name=Stremio"
      - "homepage.icon=stremio.png"
      - "homepage.href=https://stremio.${HOST_NAME:-pi.lan}"
      - "homepage.description=Streaming server (LAN, casting)"
      - "pi-pcloud.conflicts-with=stremio"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Same host rules as gluetun's routers but higher priority, so that if
      # gluetun is up for qbittorrent its now-dead stremio routers lose.
      - "traefik.http.routers.stremio-lan-root.rule=Host(`stremio.${HOST_NAME:-pi.lan}`) && Path(`/`)"
      - "traefik.http.routers.stremio-lan-root.entrypoints=websecure"
      - "traefik.http.routers.stremio-lan-root.middlewares=frame-deny@docker,lan@docker,stremio-lan-webui-redirect@docker"
      - "traefik.http.routers.stremio-lan-root.priority=80"
      - "traefik.http.routers.stremio-lan-root.tls=true"
      - "traefik.http.routers.stremio-lan-root.service=noop@internal"
      # No authelia, same reason as the gluetun-hosted router and as comet.
      - "traefik.http.routers.stremio-lan.rule=Host(`stremio.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.stremio-lan.entrypoints=websecure"
      - "traefik.http.routers.stremio-lan.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.stremio-lan.priority=60"
      - "traefik.http.routers.stremio-lan.tls=true"
      - "traefik.http.routers.stremio-lan.service=stremio-lan"
      - "traefik.http.services.stremio-lan.loadbalancer.server.port=11470"
      # Its own copy: the gluetun-hosted middleware is gone when gluetun is not selected.
      - "traefik.http.middlewares.stremio-lan-webui-redirect.redirectregex.regex=^https?://([^/]+)/?$"
      - "traefik.http.middlewares.stremio-lan-webui-redirect.redirectregex.replacement=https://app.strem.io/shell-v4.4/?streamingServer=https%3A%2F%2F$${1}"
      - "traefik.http.middlewares.stremio-lan-webui-redirect.redirectregex.permanent=false"

  comet:
    <<: *service-defaults
    # No semver image tags are published; pin latest (currently v2.54.1) by digest.
    image: ghcr.io/g0ldyy/comet:latest@sha256:dca62133336e02784d02aaad861381820674d1c8e3e98a03797610b81ee4defe
    container_name: pi-comet
    profiles: ["comet", "all"]
    networks:
      - frontend
    expose:
      - 8000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - FASTAPI_WORKERS=1
      # Single uvicorn process keeps the footprint small on the Pi (gunicorn preloads extra workers).
      - USE_GUNICORN=False
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/data/comet.db
      # TorBox itself is configured per-user in the /configure web UI (paste the TorBox API key there);
      # these passwords gate Comet's own admin dashboard and configuration page.
      - ADMIN_DASHBOARD_PASSWORD=${PASSWORD:-admin}
      - CONFIGURE_PAGE_PASSWORD=${PASSWORD:-admin}
      # CONFIGURE_PAGE_PASSWORD prefixes addon URLs with /s/<PUBLIC_API_TOKEN>/, so the
      # token must outlive recreates - the default /app/data is ephemeral and every
      # recreate would mint a new one, breaking already-installed addons.
      - PUBLIC_API_TOKEN_FILE=/data/public_api_token.txt
      # TorBox is only the debrid — it checks and streams hashes, it does not find
      # torrents. With no scraper enabled Comet returns zero results.
      - SCRAPE_TORRENTIO=True
      - SCRAPE_MEDIAFUSION=True
      - SCRAPE_ZILEAN=True
    volumes:
      - comet_data:/data
    labels:
      - "homepage.group=Video"
      - "pi-pcloud.companion-of=stremio"
      - "homepage.name=Comet"
      - "homepage.href=https://comet.${HOST_NAME:-pi.lan}"
      - "homepage.description=Stremio debrid addon"
      - "homepage.icon=stremio.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # LAN/tailnet only (lan@docker covers the tailscale ranges). No authelia: Stremio clients fetch the
      # manifest/stream endpoints programmatically and cannot pass an interactive SSO login.
      - "traefik.http.routers.comet.rule=Host(`comet.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.comet.entrypoints=websecure"
      - "traefik.http.routers.comet.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.comet.tls=true"
      - "traefik.http.services.comet.loadbalancer.server.port=8000"
    healthcheck:
      <<: *healthcheck-default
      # The image left its Alpine base and ships neither wget nor curl.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      # First boot blocks ~2-3 min downloading anime mappings before the API serves.
      start_period: 180s
    deploy: *cpu-request-small
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  prowlarr:
    <<: *service-defaults
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: pi-prowlarr
    profiles: ["prowlarr", "all"]
    networks:
      - frontend
    dns:
      - 1.1.1.1
      - 1.0.0.1
    expose:
      - 9696
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "homepage.group=Download"
      - "homepage.name=Prowlarr"
      - "homepage.icon=prowlarr.png"
      - "homepage.href=https://prowlarr.${HOST_NAME:-pi.lan}"
      - "homepage.description=Indexer manager"
      - "homepage.widget.type=prowlarr"
      - "homepage.widget.url=http://pi-prowlarr:9696"
      - "homepage.widget.key={{HOMEPAGE_FILE_PROWLARR_API_KEY}}"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ${DATA_LOCATION:-./data}/prowlarr:/config
    healthcheck:
      <<: *healthcheck-default
      # linuxserver base ships curl; Prowlarr's /ping needs no auth.
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      start_period: 45s
    deploy: *cpu-request-small
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  kapowarr:
    <<: *service-defaults
    image: mrcas/kapowarr:v1.3.1
    container_name: pi-kapowarr
    profiles: ["kapowarr", "all"]
    # Same gluetun namespace as qBittorrent (localhost:8080) so torrent path mapping
    # is an identity mapping; GetComics direct downloads also go through the VPN.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.kapowarr.rule=Host(`kapowarr.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.kapowarr.entrypoints=websecure"
      - "traefik.http.routers.kapowarr.middlewares=frame-deny@docker,lan@docker,authelia@docker"
      - "traefik.http.routers.kapowarr.tls=true"
      - "traefik.http.routers.kapowarr.service=kapowarr"
      - "traefik.http.services.kapowarr.loadbalancer.server.port=5656"
      - "homepage.group=Books"
      - "homepage.name=Kapowarr"
      - "homepage.icon=kapowarr.png"
      - "homepage.href=https://kapowarr.${HOST_NAME:-pi.lan}"
      - "homepage.description=Comics manager"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ${DATA_LOCATION:-./data}/kapowarr/db:/app/db
      # Own temp dir for GetComics direct downloads (entrypoint chowns it to PUID).
      - ${DATA_LOCATION:-./data}/kapowarr/downloads:/app/temp_downloads
      # Shared download folder mounted at the SAME path qBittorrent uses, so torrents
      # grabbed via the qBittorrent client import with an identity path mapping.
      - ${DATA_LOCATION:-./data}/download:/downloads
      - ${DATA_LOCATION:-./data}/comics:/comics
      # Second root folder: manga volumes live here so Kavita can serve them from a
      # Manga-type library instead of the comic parser.
      - ${DATA_LOCATION:-./data}/manga:/manga
    healthcheck:
      <<: *healthcheck-default
      # python-slim base — no curl/wget; probe the UI with the bundled interpreter.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5656/').status==200 else 1)"]
      start_period: 45s
    deploy: *cpu-request-small
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  flaresolverr:
    <<: *service-defaults
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: pi-flaresolverr
    profiles: ["flaresolverr", "prowlarr", "all"]
    labels:
      - "homepage.description=Cloudflare challenge solver for Prowlarr"
      - "pi-pcloud.companion-of=prowlarr"
    networks:
      - frontend
    dns:
      - 1.1.1.1
      - 1.0.0.1
    expose:
      - 8191
    environment:
      - LOG_LEVEL=info
      - TZ=${TIMEZONE:-Europe/Paris}
    # Chrome crashes with the default 64MB /dev/shm; give it room to render pages.
    shm_size: "256m"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/health"]
      start_period: 45s
    deploy: *cpu-request-small
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  kavita:
    <<: *service-defaults
    image: lscr.io/linuxserver/kavita:0.9.1
    container_name: pi-kavita
    profiles: ["kavita", "all"]
    networks:
      - frontend
    extra_hosts:
      # Let Kavita reach Authelia's OIDC discovery endpoint via Traefik internally.
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    expose:
      - 5000
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - kavita_config:/config
      # One read-only mount per Kavita library, so each gets its own library type
      # (ComicVine for comics, Manga for right-to-left, Book for epub/pdf).
      # Kapowarr owns comics/ and manga/; the download/* folders are the save paths
      # of the matching qBittorrent categories. Never the download root: Kavita walks
      # every subfolder, so a software torrent's installer tree turns into series
      # named after its internals.
      - ${DATA_LOCATION:-./data}/comics:/comics:ro
      - ${DATA_LOCATION:-./data}/manga:/manga:ro
      - ${DATA_LOCATION:-./data}/download/manga:/manga-downloads:ro
      - ${DATA_LOCATION:-./data}/download/books:/books:ro
    labels:
      - "homepage.group=Books"
      - "homepage.name=Kavita"
      - "homepage.icon=kavita.png"
      - "homepage.href=https://kavita.${HOST_NAME:-pi.lan}"
      - "homepage.description=Comics, manga and ebooks reader"
      - "homepage.widget.type=kavita"
      - "homepage.widget.url=http://pi-kavita:5000"
      # An API key, not username/password: Kavita's OIDC config sets
      # DisablePasswordAuthentication, so /api/Account/login rejects every password
      # ("password authentication disabled"). It exempts apiKey logins from that
      # check, and Homepage only sends the key when no username/password is set.
      - "homepage.widget.key={{HOMEPAGE_FILE_KAVITA_API_KEY}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Kavita has its own account system (and OPDS clients cannot pass interactive SSO),
      # so lan@docker only — no authelia in front (same rationale as Immich).
      - "traefik.http.routers.kavita.rule=Host(`kavita.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.kavita.entrypoints=websecure"
      - "traefik.http.routers.kavita.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.kavita.tls=true"
      - "traefik.http.services.kavita.loadbalancer.server.port=5000"
    healthcheck:
      <<: *healthcheck-default
      # linuxserver base ships curl; Kavita exposes /api/health.
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      start_period: 45s
    deploy: *cpu-request-small
    # Idle RSS is ~210 MB; the headroom is for cover generation, where libvips
    # decodes a whole page and 512m was OOM-killed on files over 100 MB.
    mem_limit: 1g
    oom_score_adj: *oom-score-deprioritize

  ntfy:
    <<: *service-defaults
    image: binwiederhier/ntfy:v2.28.0
    container_name: pi-ntfy
    command: serve
    networks:
      - frontend
      - ntfy
    expose:
      - 80
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - NTFY_BASE_URL=https://ntfy.${HOST_NAME:-pi.lan}
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_ENABLE_LOGIN=true
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_SMTP_SENDER_ADDR=${SMTP_HOST:-localhost}:${SMTP_PORT:-587}
      - NTFY_SMTP_SENDER_USER=${SMTP_USERNAME:-}
      - NTFY_SMTP_SENDER_PASS=${SMTP_PASSWORD:-}
      - NTFY_SMTP_SENDER_FROM=${EMAIL:-noreply@localhost}
    env_file:
      - path: ./config/ntfy/ntfy.env
        required: false
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    labels:
      - "homepage.group=Notifications"
      - "homepage.name=ntfy"
      - "homepage.icon=ntfy.png"
      - "homepage.href=https://ntfy.${HOST_NAME:-pi.lan}"
      - "homepage.description=Self-hosted notifications"
      - "homepage.widget.type=ntfy"
      - "homepage.widget.url=http://pi-ntfy"
      # The widget reads a single topic; monitoring is the one worth a glance on
      # the dashboard. downloads and security are phone-only topics.
      - "homepage.widget.topic=monitoring"
      - "homepage.widget.username={{HOMEPAGE_VAR_ADMIN_USER}}"
      - "homepage.widget.password={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.ntfy.rule=Host(`ntfy.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.ntfy.entrypoints=websecure"
      - "traefik.http.routers.ntfy.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.ntfy.tls=true"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
    healthcheck:
      <<: *healthcheck-light
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/v1/health"]
    deploy: *cpu-request-small
    mem_limit: 128m
    oom_score_adj: *oom-score-important

  vaultwarden:
    <<: *service-defaults
    image: vaultwarden/server:1.37.2
    container_name: pi-vaultwarden
    profiles: ["vaultwarden", "all"]
    networks:
      - frontend
      - vault
    expose:
      - 80
    # So the SSO_AUTHORITY discovery call resolves to Traefik from inside frontend.
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    # Neither SSO_CLIENT_SECRET nor ADMIN_TOKEN has a *_FILE variant, so the mounted
    # secrets are exported before handing over to the image's own /start.sh. Same
    # trick as open-webui. Both values are hex/PHC, so they need no quoting.
    entrypoint: ["sh", "-c", "export SSO_CLIENT_SECRET=$(cat /run/secrets/oidc_vaultwarden_secret) ADMIN_TOKEN=$(cat /run/secrets/admin_token_hash) && exec /start.sh"]
    environment:
      - DOMAIN=https://vault.${HOST_NAME:-pi.lan}
      - DATABASE_URL=postgresql://vaultwarden:${PASSWORD}@postgres/vaultwarden
      # This router is only behind the LAN allowlist, so open registration would
      # let anyone on the tailnet create a vault. Invite from /admin instead.
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      # ADMIN_TOKEN is exported by the entrypoint from an Argon2id digest generated
      # by scripts/vaultwarden-pre-start.sh - deliberately not derived from PASSWORD.
      # This does NOT remove the master password: that key encrypts the vault
      # itself and never reaches the identity provider.
      - SSO_ENABLED=true
      - SSO_AUTHORITY=https://auth.${HOST_NAME:-pi.lan}
      - SSO_CLIENT_ID=vaultwarden
      - SSO_SCOPES=profile email offline_access
      # Native email+password login is off, so everyone who signs in - including
      # an emergency-access contact - must exist in LLDAP. An invitation only
      # creates a stub account, claimed by signing in through Authelia.
      - SSO_ONLY=true
      # Deliberate, not just the default: needs the SMTP below to deliver its
      # invite, grant and takeover-notification mails.
      - EMERGENCY_ACCESS_ALLOWED=true
      # starttls suits the default port 587; use force_tls on 465.
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=starttls
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${EMAIL:-noreply@localhost}
      - SMTP_FROM_NAME=Vaultwarden
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ${DATA_LOCATION:-./data}/vaultwarden:/data
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_vaultwarden_secret.txt:/run/secrets/oidc_vaultwarden_secret:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/vaultwarden_admin_token_hash:/run/secrets/admin_token_hash:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The bundled /healthcheck.sh already handles ROCKET_PORT and base paths.
      <<: *healthcheck-light
      test: ["CMD", "/healthcheck.sh"]
    labels:
      - "homepage.group=Security"
      - "homepage.name=Vaultwarden"
      - "homepage.icon=vaultwarden.png"
      - "homepage.href=https://vault.${HOST_NAME:-pi.lan}"
      - "homepage.description=Bitwarden-compatible password manager"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Deliberately no authelia@docker: forward-auth breaks the browser extension
      # and mobile clients, which cannot complete the interactive portal. They are
      # authenticated through OIDC instead (see SSO_* above).
      # The websecure entrypoint's security-headers sets X-Frame-Options: DENY on
      # every response, which Vaultwarden's own diagnostics flag: it replaces the
      # SAMEORIGIN the API needs, and adds the header to the *-connector.html pages
      # that must have none - those are framed by the browser extension from a
      # chrome-extension:// origin, which any X-Frame-Options value would block.
      # Restoring per-router requires re-emitting the header after the entrypoint.
      - "traefik.http.middlewares.vaultwarden-frame.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.middlewares=vaultwarden-frame@docker,lan@docker"
      - "traefik.http.routers.vaultwarden.tls=true"
      # Longer rule than the catch-all above, so Traefik's rule-length priority
      # picks it for the connector pages without an explicit priority.
      - "traefik.http.routers.vaultwarden-connector.rule=Host(`vault.${HOST_NAME:-pi.lan}`) && (Path(`/webauthn-connector.html`) || Path(`/sso-connector.html`))"
      - "traefik.http.routers.vaultwarden-connector.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-connector.middlewares=lan@docker"
      - "traefik.http.routers.vaultwarden-connector.tls=true"
      - "traefik.http.routers.vaultwarden-connector.service=vaultwarden"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    deploy: *cpu-request-tiny
    mem_limit: 256m
    oom_score_adj: *oom-score-important

  # Authentication & SSO
  lldap:
    <<: *service-defaults
    image: lldap/lldap:v0.6.3-alpine@sha256:2a8454b668c1aba7157e832eab0e242e1e7eb5fb7591d7e7774ba05286511ca8
    container_name: pi-lldap
    networks:
      - frontend
      - auth
    expose:
      - 3890
      - 17170
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - LLDAP_LDAP_BASE_DN=dc=home,dc=ldap
      - LLDAP_LDAP_USER_EMAIL=${EMAIL}
      - LLDAP_LDAP_USER_PASS=${PASSWORD}
      - LLDAP_HTTP_URL=https://lldap.${HOST_NAME:-pi.lan}
      - LLDAP_DATABASE_URL=postgres://lldap:${PASSWORD}@postgres/lldap
      - LLDAP_VERBOSE=false
      - LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET=true
      - LLDAP_SMTP_OPTIONS__SERVER=${SMTP_HOST:-localhost}
      - LLDAP_SMTP_OPTIONS__PORT=${SMTP_PORT:-587}
      - LLDAP_SMTP_OPTIONS__SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-STARTTLS}
      - LLDAP_SMTP_OPTIONS__USER=${SMTP_USERNAME:-}
      - LLDAP_SMTP_OPTIONS__PASSWORD=${SMTP_PASSWORD:-}
      - LLDAP_SMTP_OPTIONS__FROM=${EMAIL:-noreply@localhost}
    env_file:
      - path: ./config/lldap/lldap.env
        required: false
    volumes:
      - ${DATA_LOCATION:-./data}/lldap:/data
    depends_on:
      - postgres
    healthcheck:
      <<: *healthcheck-default
      # A responding HTTP API confirms the LDAP port is up too, which is what
      # authelia dials at startup.
      test: ["CMD", "curl", "-sf", "http://localhost:17170/"]
      start_period: 30s
    labels:
      - "homepage.group=Authentication"
      - "homepage.name=LLDAP"
      - "homepage.href=https://lldap.${HOST_NAME:-pi.lan}"
      - "homepage.description=User directory management"
      - "homepage.icon=lldap.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.lldap.rule=Host(`lldap.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.lldap.entrypoints=websecure"
      - "traefik.http.routers.lldap.middlewares=frame-deny@docker,lan@docker,rate-limit-auth@docker,authelia@docker"
      - "traefik.http.routers.lldap.tls=true"
      - "traefik.http.services.lldap.loadbalancer.server.port=17170"
    deploy: *cpu-request-small
    mem_limit: 128m
    oom_score_adj: *oom-score-critical

  authelia:
    <<: *service-defaults
    image: authelia/authelia:4.39.20
    container_name: pi-authelia
    networks:
      - frontend
      - auth
    expose:
      - 9091
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - X_AUTHELIA_CONFIG_FILTERS=template
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-STARTTLS}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL=${EMAIL:-authelia@localhost}
    volumes:
      - ${DATA_LOCATION:-./data}/authelia-config/configuration.yml:/config/configuration.yml:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets:/config/secrets:ro
      - ${DATA_LOCATION:-./data}/authelia-config:/config/data
    depends_on:
      lldap:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/api/health"]
      start_period: 10s
      start_interval: 5s
    labels:
      - "homepage.group=Authentication"
      - "homepage.name=Authelia"
      - "homepage.icon=authelia.png"
      - "homepage.href=https://auth.${HOST_NAME:-pi.lan}"
      - "homepage.description=SSO authentication portal"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.authelia.rule=Host(`auth.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.middlewares=frame-deny@docker,security-headers@docker"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      - "traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth"
      # trustForwardHeader is safe here: Traefik is the only trusted upstream on the internal frontend network
      - "traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia.forwardauth.authRequestHeaders=Accept,Cookie,Authorization"
      - "traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
      - "traefik.http.middlewares.authelia.forwardauth.maxResponseBodySize=4096"
    deploy: *cpu-request-small
    mem_limit: 128m
    oom_score_adj: *oom-score-critical

  # AI
  # Inference backend for open-webui, serving Gemma 4 E2B on the Pi's CPU.
  #
  # llama.cpp's own server rather than Ollama, which wraps this exact engine and
  # adds a model registry and per-request runners - dead weight on a box with
  # room for one resident model. Going direct runs one process instead of two and
  # already speaks the OpenAI API open-webui calls.
  llama-cpp:
    <<: *service-defaults
    image: ghcr.io/ggml-org/llama.cpp:server-b10481
    container_name: pi-llama-cpp
    profiles: ["llama-cpp", "all"]
    networks:
      - ai
    expose:
      - 8080
    environment:
      # The ai network is internal: scripts/llama-cpp-pre-start.sh seeds the
      # volume beforehand and OFFLINE stops the server from trying to fetch.
      - LLAMA_ARG_MODEL=/models/gemma-4-E2B-it-qat-Q4_0.gguf
      - LLAMA_ARG_MMPROJ=/models/mmproj-gemma-4-E2B-it.gguf
      - LLAMA_ARG_OFFLINE=1
      # Speculative decoding off Gemma 4's multi-token-prediction head. CPU
      # generation is bandwidth bound, so verifying several drafted tokens in one
      # pass is nearly free: 5.3 -> 10.6 tok/s here, with identical output.
      - LLAMA_ARG_SPEC_DRAFT_MODEL=/models/mtp-gemma-4-E2B-it-Q4_0.gguf
      - LLAMA_ARG_SPEC_TYPE=draft-mtp
      - LLAMA_ARG_ALIAS=gemma-4-e2b-it
      - LLAMA_ARG_PORT=8080
      # A fourth thread measured no faster (bandwidth bound), and leaving core 0
      # alone keeps traefik, pihole and unbound responsive during a chat.
      - LLAMA_ARG_THREADS=3
      - LLAMA_ARG_FLASH_ATTN=on
      # The model goes to 128k, which no Pi has the RAM or the patience for. Left
      # at f16: sliding-window attention keeps the cache small anyway, and
      # quantising it cost ~10% generation speed for no memory worth having.
      - LLAMA_ARG_CTX_SIZE=16384
      # Thinking off: at 10 tok/s, reasoning meant ~500 tokens - a minute of empty
      # chat window - before the first word of an answer. Drop this line to
      # restore it. --reasoning-budget 0 is NOT equivalent: it closes the channel
      # without telling the model, which then reasons in the visible answer.
      - 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"enable_thinking":false}'
      # Concurrent requests queue instead of splitting the three threads: the
      # default runs several slots at once, and two parallel requests each
      # generated at ~5 tok/s here rather than one at ~10.
      - LLAMA_ARG_N_PARALLEL=1
      # open-webui is the routed frontend; keep the surface down to the API.
      - LLAMA_ARG_UI=false
    volumes:
      - llama_models:/models
    healthcheck:
      <<: *healthcheck-relaxed
      # /health is 503 while the weights load, 200 once a slot is free.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      start_period: 120s
      start_interval: 5s
    labels:
      # No homepage.href: an API behind open-webui, not a page to open. mdi- icons
      # throughout the group because dashboard-icons has nothing for these.
      - "homepage.group=AI"
      - "homepage.name=llama.cpp"
      - "homepage.description=Gemma 4 E2B inference"
      - "homepage.icon=mdi-brain"
    deploy: *cpu-request-xlarge
    cpuset: "1-3"
    # Weights are mmap'd, and the cgroup counts those pages: 3.4G of model plus
    # ~1G of vision projector, KV cache and compute buffers.
    mem_limit: 6g
    oom_score_adj: *oom-score-deprioritize

  # Text-to-speech for open-webui's read-aloud button, with real French voices.
  #
  # Built here because upstream (OHF-Voice/piper1-gpl) publishes no image, and its
  # own server speaks its own protocol rather than the OpenAI shape open-webui
  # calls - see config/piper/openai_api.py for that translation.
  piper:
    <<: *service-defaults
    build:
      context: ./config/piper
      dockerfile: Dockerfile
    image: pi-piper:local
    container_name: pi-piper
    profiles: ["piper", "all"]
    networks:
      - ai
    expose:
      - 8000
    environment:
      # open-webui defaults to OpenAI voice names (alloy, echo), none of which
      # exist here, so in practice this picks the voice. A language rather than a
      # voice id, so moving the stack to another language needs no Piper
      # knowledge; set PIPER_DEFAULT_VOICE to name one outright. The voice has to
      # be in the image - see the VOICES build arg in config/piper/Dockerfile.
      - PIPER_DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en-US}
    healthcheck:
      <<: *healthcheck-relaxed
      # python:3.12-slim ships no curl or wget, but python is the point of it.
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health').read()"]
      start_period: 30s
    labels:
      - "homepage.group=AI"
      - "homepage.name=Piper"
      - "homepage.description=Text-to-speech, French by default"
      - "homepage.icon=mdi-text-to-speech"
    deploy: *cpu-request-small
    # Same three cores as llama-cpp, leaving core 0 to traefik and DNS.
    cpuset: "1-3"
    mem_limit: 512m
    oom_score_adj: *oom-score-deprioritize

  # Speech-to-text for open-webui's microphone button.
  #
  # Open WebUI's own faster-whisper runs inside the open-webui container, capped
  # at 1g and already sitting at ~730MB, so the model has to stay small enough to
  # be bad. On 113s of read French (FLEURS fr_fr) over this Pi's three cores the
  # default `base` scored 20.2% WER at 0.95x realtime; `small` 12.5% at 1.25x and
  # `medium` 4.9% at 3.99x, the last two needing 1-2.7GB the web UI has no room
  # for. Parakeet lands whisper-medium's accuracy at 8.7% WER and 0.17x realtime,
  # a dictated sentence coming back in well under a second, and has no language
  # setting at all: it covers 25 European languages and picks one acoustically.
  #
  # Built here for the same reason as piper: upstream publishes no image, and
  # onnx-asr has no HTTP server at all - see config/parakeet/openai_api.py.
  parakeet:
    <<: *service-defaults
    build:
      context: ./config/parakeet
      dockerfile: Dockerfile
    image: pi-parakeet:local
    container_name: pi-parakeet
    profiles: ["parakeet", "all"]
    networks:
      - ai
    expose:
      - 8000
    environment:
      # Must match the Dockerfile build arg of the same name, or the weights
      # loaded are not the weights present. fp32 is the better model - 4.5% WER
      # against 8.7% - but 2.3GB resident instead of 1.2GB, and a ~2.5GB download.
      - PARAKEET_QUANTIZATION=int8
      # Matches the cpuset below; onnxruntime would otherwise size its thread
      # pool from the host's four cores and oversubscribe the cgroup.
      - PARAKEET_THREADS=3
    healthcheck:
      <<: *healthcheck-relaxed
      # /health is 503 until the model is resident, ~5s from start.
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health').read()"]
      start_period: 60s
    labels:
      - "homepage.group=AI"
      - "homepage.name=Parakeet"
      - "homepage.description=Multilingual speech-to-text"
      - "homepage.icon=mdi-microphone-message"
    deploy: *cpu-request-small
    # Same three cores as llama-cpp and piper, leaving core 0 to traefik and DNS.
    cpuset: "1-3"
    # ~1.2GB resident for the int8 weights and the onnxruntime arena, plus the
    # encoder's working set on a full window (~1.4GB measured). The headroom is
    # what stops a long upload being an OOM: before openai_api.py windowed them,
    # a 120s pass went past 2GB.
    mem_limit: 2560m
    oom_score_adj: *oom-score-deprioritize

  # Serves the host's status to the local model as an OpenAPI tool; see
  # config/system-tools/app.py. / is mounted at /hostfs because statvfs cannot
  # measure a filesystem this process cannot see.
  system-tools:
    <<: *service-defaults
    build:
      context: ./config/system-tools
      dockerfile: Dockerfile
    image: pi-system-tools:local
    container_name: pi-system-tools
    profiles: ["system-tools", "all"]
    networks:
      - ai
      # `devices` reads headscale's node API, which only listens on frontend.
      # Egress only: nothing here accepts a URL, so the reachable surface widens
      # but the steerable one does not. Putting headscale on `ai` instead would
      # hand it a leg into the network where open-webui runs admin-supplied Python.
      - frontend
    expose:
      - 8000
    environment:
      # Without this the container is UTC and `uptime` is four hours off.
      - TZ=${TIMEZONE:-Europe/Paris}
      # Derived from the directory name, so it cannot be guessed in-container.
      - COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-pi-web}
      # Backrest's own log, because the repos are remote and restic would want
      # their password. Read off the bind mount below rather than through
      # /hostfs: DATA_LOCATION is relative to the project directory by default,
      # and a relative path means nothing against the host root.
      - BACKREST_OPLOG=/run/backrest/oplog.sqlite
      - HEADSCALE_URL=http://pi-headscale:8080
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      # rslave, or unplugging /mnt/usbdrive fails while this container runs.
      - type: bind
        source: /
        target: /hostfs
        read_only: true
        bind:
          propagation: rslave
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Backrest's data directory, holding the oplog `backups` reads. A directory
      # rather than the file itself: the oplog does not exist before backrest's
      # first run, and Docker would materialise a directory in its place.
      - ${DATA_LOCATION:-./data}/backrest/data:/run/backrest:ro
      # The key homepage's headscale widget already uses, rather than a second one
      # to rotate: Headscale API keys expire, so both break together.
      # scripts/headscale-pre-start.sh keeps the path a file, or Docker would
      # create a directory here and the bootstrap could never write the key in.
      - ./config/homepage/secrets/headscale_api_key:/run/secrets/headscale_api_key:ro
    healthcheck:
      <<: *healthcheck-relaxed
      test: ["CMD", "python3", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health').read()"]
      start_period: 20s
    labels:
      - "homepage.group=AI"
      - "homepage.name=System Tools"
      - "homepage.description=Server status for the local LLM"
      - "homepage.icon=mdi-tools"
    # No cpuset: a call only runs while llama-cpp waits for its result.
    deploy: *cpu-request-tiny
    mem_limit: 192m
    oom_score_adj: *oom-score-deprioritize

  open-webui:
    <<: *service-defaults
    image: ghcr.io/open-webui/open-webui:v0.11.1
    container_name: pi-open-webui
    profiles: ["open-webui", "all"]
    networks:
      - frontend
      - ai
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.1"
    expose:
      - 8080
    entrypoint: ["bash", "-c", "export OAUTH_CLIENT_SECRET=$(cat /run/secrets/oidc_open-webui_secret) && exec bash start.sh"]
    environment:
      - WEBUI_AUTH=true
      - ENABLE_LOGIN_FORM=false
      - CORS_ALLOW_ORIGIN=https://ai.${HOST_NAME:-pi.lan}
      - ENABLE_OAUTH_SIGNUP=true
      # Authelia already gates ai.${HOST_NAME:-pi.lan}, so Open WebUI's own
      # "pending" default would just park every SSO login until an admin looks.
      - DEFAULT_USER_ROLE=user
      - OAUTH_CLIENT_ID=open-webui
      - OPENID_PROVIDER_URL=https://auth.${HOST_NAME:-pi.lan}/.well-known/openid-configuration
      - OAUTH_PROVIDER_NAME=Authelia
      - OAUTH_SCOPES=openid profile email
      - OAUTH_USERNAME_CLAIM=preferred_username
      - DATABASE_URL=postgresql://open-webui:${PASSWORD}@postgres/open-webui
      # The key is required by the client but ignored by llama-server, which runs
      # unauthenticated on the internal ai network - same for piper and parakeet.
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://llama-cpp:8080/v1
      - OPENAI_API_KEY=llama-cpp
      # No Ollama in the stack; left on, this probes localhost:11434 on every
      # start and on the model list of every page load.
      - ENABLE_OLLAMA_API=false
      - DEFAULT_LOCALE=${DEFAULT_LANGUAGE:-en-US}
      # Speech-to-text on the parakeet sidecar rather than the faster-whisper that
      # ships inside this container - see that service for the numbers. These are
      # PersistentConfig, so they only take on an instance that has never started;
      # scripts/open-webui-bootstrap.sh carries the same values to one whose
      # database already exists.
      #
      # The base URL is not optional: Open WebUI defaults it to
      # OPENAI_API_BASE_URL, which here is llama-cpp, so leaving it out would
      # point the microphone at the chat model.
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://parakeet:8000/v1
      - AUDIO_STT_MODEL=parakeet-tdt-0.6b-v3
      - AUDIO_STT_OPENAI_API_KEY=parakeet
    volumes:
      - open_webui_data:/app/backend/data
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_open-webui_secret.txt:/run/secrets/oidc_open-webui_secret:ro
    depends_on:
      postgres:
        condition: service_healthy
      llama-cpp:
        condition: service_started
        required: false
      # service_started, not service_healthy: system-tools is on the relaxed
      # healthcheck (120s interval, no start_interval), so Docker's first probe
      # lands at t=120s and the chat UI would wait for it on every boot - for a
      # tool server that is only ever called mid-conversation.
      system-tools:
        condition: service_started
        required: false
    healthcheck:
      <<: *healthcheck-relaxed
      test: ["CMD", "curl", "-fsS", "http://localhost:8080"]
      start_period: 60s
    labels:
      - "homepage.group=AI"
      - "homepage.name=Open WebUI"
      - "homepage.href=https://ai.${HOST_NAME:-pi.lan}"
      - "homepage.description=Local AI chat"
      - "homepage.icon=open-webui.png"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.open-webui.rule=Host(`ai.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.middlewares=frame-deny@docker,lan@docker"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
    deploy: *cpu-request-small
    mem_limit: 1g
    oom_score_adj: *oom-score-deprioritize

  # Database & Cache
  postgres:
    <<: *service-defaults
    restart: always
    container_name: pi-postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    environment:
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DATA_LOCATION:-./data}/postgres:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh
    networks:
      - immich
      - nextcloud
      - auth
      - ai
      - vault
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      start_interval: 3s
    mem_limit: 1536m
    cpuset: "1-3"
    deploy: *cpu-request-xlarge
    shm_size: 256mb
    oom_score_adj: *oom-score-critical

  redis:
    <<: *service-defaults
    restart: always
    container_name: pi-redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "redis-cli", "ping"]
      start_period: 5s
      start_interval: 3s
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    volumes:
      - ./config/redis/valkey.conf:/etc/valkey/valkey.conf:ro
      - redis_data:/data
    networks:
      - immich
      - nextcloud
      - auth
    deploy: *cpu-request-small
    # Shared by Immich, Nextcloud and Authelia. Peak dataset has been seen at
    # ~44M; the limit must also cover the BGSAVE fork's copy-on-write pages, so
    # keep it well above config/redis/valkey.conf's maxmemory (192mb).
    mem_limit: 256m
    oom_score_adj: *oom-score-critical

volumes:
  # Seeded by scripts/llama-cpp-pre-start.sh. A volume rather than a
  # DATA_LOCATION bind mount so the mmap'd weights sit on the NVMe, not the USB.
  llama_models:
  open_webui_data:
  ddns_data:
  stremio_data:
  comet_data:
  kavita_config:
  beszel_data:
  beszel_agent_data:
  beszel_socket:
  dockhand_data:
  pihole_data:
  n8n_data:
  ntfy_cache:
  ntfy_data:
  immich_model_cache:
  nextcloud_html:
  headscale_data:
  headplane_data:
  tailscale_state:
  redis_data:

networks:
  dns_internal:
    driver: bridge
    name: dns_internal
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.30.53.0/24
          gateway: 172.30.53.1
  dns_egress:
    driver: bridge
    name: dns_egress
  frontend:
    driver: bridge
    name: frontend
    ipam:
      driver: default
      config:
        - subnet: 172.30.11.0/24
          gateway: 172.30.11.1
  lan:
    driver: macvlan
    name: lan
    driver_opts:
      parent: ${HOST_LAN_PARENT:-eth0}
    ipam:
      driver: default
      config:
        - subnet: ${HOST_LAN_SUBNET:-192.168.1.0/24}
          gateway: ${HOST_LAN_GATEWAY:-192.168.1.1}
  nextcloud:
    driver: bridge
    name: nextcloud
    internal: true
  immich:
    driver: bridge
    name: immich
    internal: true
  ntfy:
    driver: bridge
    name: ntfy
    internal: true
  auth:
    driver: bridge
    name: auth
    internal: true
  n8n_runners:
    driver: bridge
    name: n8n_runners
  ai:
    driver: bridge
    name: ai
    internal: true
  # A dedicated segment rather than reusing "auth" so the vault has no path to
  # lldap, matching the split already used for immich, nextcloud and ai.
  vault:
    driver: bridge
    name: vault
    internal: true
