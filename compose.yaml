  nextcloud:
    <<: *service-defaults
    image: nextcloud:34.0.3-apache
    container_name: pi-nextcloud
    environment:
      - NEXTCLOUD_ADMIN_USER=${ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${PASSWORD}
      - NEXTCLOUD_ADMIN_EMAIL=${EMAIL}
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.${HOST_NAME:-pi.lan} localhost 127.0.0.1
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
      - OVERWRITEHOST=nextcloud.${HOST_NAME:-pi.lan}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://nextcloud.${HOST_NAME:-pi.lan}
      - TRUSTED_PROXIES=172.30.11.250/32
      - ALLOW_IP_RANGES=${ALLOW_IP_RANGES:-127.0.0.1/32,192.168.1.0/24,100.64.0.0/10,172.30.0.0/16}
      - FORWARDED_FOR_HEADERS=HTTP_X_FORWARDED_FOR
      - NEXTCLOUD_MAINTENANCE_WINDOW_START=${NEXTCLOUD_MAINTENANCE_WINDOW_START:-2}
      - NEXTCLOUD_DEFAULT_PHONE_REGION=${NEXTCLOUD_DEFAULT_PHONE_REGION:-FR}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${PASSWORD}
      - REDIS_HOST=redis
      - TZ=${TIMEZONE:-Europe/Paris}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_SECURE=${SMTP_SECURE:-tls}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_AUTHTYPE=${SMTP_AUTHTYPE:-LOGIN}
      - SMTP_NAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-nextcloud}
      - MAIL_DOMAIN=${HOST_NAME:-pi.lan}
    volumes:
      - nextcloud_html:/var/www/html
      - ${DATA_LOCATION:-./data}/nextcloud:/var/www/html/data
      - ${DATA_LOCATION:-./data}/nextcloud-config:/var/www/html/config
      - ${DATA_LOCATION:-./data}/nextcloud-themes:/var/www/html/themes
      - ${DATA_LOCATION:-./data}/download:/mnt/qbittorrent-downloads:ro
      - ./config/nextcloud/custom.config.php:/var/www/html/config/custom.config.php:ro
      - ./config/nextcloud/security-headers.conf:/etc/apache2/conf-enabled/security-headers.conf:ro
      - ./config/nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
    extra_hosts:
      - "auth.${HOST_NAME:-pi.lan}:172.30.11.250"
    networks:
      - frontend
      - nextcloud
    labels:
      - "homepage.group=Storage"
      - "homepage.name=Nextcloud"
      - "homepage.icon=nextcloud.png"
      - "homepage.href=https://nextcloud.${HOST_NAME:-pi.lan}"
      - "homepage.description=File sync and collaboration"
      - "homepage.widget.type=nextcloud"
      - "homepage.widget.url=https://nextcloud.${HOST_NAME:-pi.lan}"
      - "homepage.widget.username={{HOMEPAGE_VAR_NEXTCLOUD_USER}}"
      - "homepage.widget.password={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.nextcloud.middlewares=lan@docker"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.priority=10"
      - "traefik.http.routers.nextcloud-public.rule=Host(`nextcloud.${HOST_NAME:-pi.lan}`) && (PathPrefix(`/s/`) || PathPrefix(`/public.php`) || PathPrefix(`/avatar/`) || PathPrefix(`/dist/`) || PathPrefix(`/apps/`) || PathPrefix(`/js/`) || PathPrefix(`/core/`) || PathPrefix(`/themes/`) || PathPrefix(`/remote.php/dav/calendars/`) || PathPrefix(`/remote.php/dav/public-calendars/`))"
      - "traefik.http.routers.nextcloud-public.entrypoints=websecure"
      - "traefik.http.routers.nextcloud-public.tls=true"
      - "traefik.http.routers.nextcloud-public.priority=20"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      start_period: 60s
      start_interval: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpuset: "1-3"
    deploy: *cpu-request-large
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  homepage:
    <<: *service-defaults
    image: ghcr.io/gethomepage/homepage:latest
    container_name: pi-homepage
    networks:
      - frontend
    expose:
      - 3000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - HOMEPAGE_ALLOWED_HOSTS=homepage.${HOST_NAME:-pi.lan}
      # Reused by widget labels as {{HOMEPAGE_VAR_x}} for services whose widget
      # accepts the same admin credentials already used stack-wide (.env).
      - HOMEPAGE_VAR_ADMIN_USER=${ADMIN_USER:-admin}
      - HOMEPAGE_VAR_ADMIN_PASSWORD=${PASSWORD}
      # Nextcloud's actual admin account was provisioned with $EMAIL as the
      # username (NEXTCLOUD_ADMIN_USER only applies at first install; that's
      # what it resolved to back then), not the current $ADMIN_USER value.
      - HOMEPAGE_VAR_NEXTCLOUD_USER=${EMAIL}
      # Read by widget labels as {{HOMEPAGE_FILE_x}}; files are written by
      # scripts/homepage-widgets-bootstrap.sh into config/homepage/secrets/,
      # which is already visible here under /app/config/secrets.
      - HOMEPAGE_FILE_PROWLARR_API_KEY=/app/config/secrets/prowlarr_api_key
      - HOMEPAGE_FILE_HEADSCALE_API_KEY=/app/config/secrets/headscale_api_key
      - HOMEPAGE_FILE_HEADSCALE_NODE_ID=/app/config/secrets/headscale_node_id
    # No auto-provisioning for Immich/Kavita (neither exposes a way to create
    # an API key without an already-logged-in admin session) - fill in
    # config/homepage/homepage.env yourself, see homepage.env.example.
    # Left empty, the widget just shows an error icon instead of live stats.
    env_file:
      - path: ./config/homepage/homepage.env
        required: false
    extra_hosts:
      # So the Nextcloud widget's https:// call passes its NEXTCLOUD_TRUSTED_DOMAINS
      # check (same trick used for auth.${HOST_NAME} elsewhere in this compose file).
      - "nextcloud.${HOST_NAME:-pi.lan}:172.30.11.250"
    volumes:
      - ./config/homepage:/app/config
      # Serves config/homepage/icons/ at /icons/, so `homepage.icon` labels can
      # reference local images. Nothing in /app/config is reachable over HTTP -
      # /api/config/<file> is hardcoded to custom.css and custom.js only - so
      # /app/public is the only way to hand homepage its own image files.
      - ./config/homepage/icons:/app/public/icons:ro
      # The pi favicon, overriding homepage's stock icons. Done this way rather
      # than with `favicon:` in settings.yaml because that setting is only applied
      # after hydration, which left the tab flickering from pi to the browser's
      # generic fallback (see the note in settings.yaml). These files are what the
      # server-rendered HTML points at, so the glyph is right from the first byte
      # and nothing replaces it. /favicon.ico is not referenced by that HTML but
      # browsers request it as a last resort, so it is covered too.
      # Regenerate all of them with scripts/homepage-favicon.sh after editing
      # config/homepage/icons/pi.svg.
      - ./config/homepage/icons/favicon.ico:/app/public/favicon.ico:ro
      - ./config/homepage/icons/favicon-16x16.png:/app/public/favicon-16x16.png:ro
      - ./config/homepage/icons/favicon-32x32.png:/app/public/favicon-32x32.png:ro
      - ./config/homepage/icons/homepage.ico:/app/public/homepage.ico:ro
      - ./config/homepage/icons/apple-touch-icon.png:/app/public/apple-touch-icon.png:ro
      - ./config/homepage/icons/safari-pinned-tab.svg:/app/public/safari-pinned-tab.svg:ro
      - ./config/homepage/icons/android-chrome-192x192.png:/app/public/android-chrome-192x192.png:ro
      - ./config/homepage/icons/android-chrome-512x512.png:/app/public/android-chrome-512x512.png:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
    tmpfs:
      - /app/config/logs
    labels:
      - "homepage.group=Dashboard"
      - "homepage.name=Homepage"
      - "homepage.icon=homepage.png"
      - "homepage.href=https://homepage.${HOST_NAME:-pi.lan}"
      - "homepage.description=Service dashboard"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.middlewares=lan@docker,authelia@docker"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
    depends_on:
      - traefik
    deploy: *cpu-request-small
    mem_limit: 192m
    oom_score_adj: *oom-score-deprioritize

  gluetun:
    <<: *service-defaults
    image: qmcgaw/gluetun:v3
    container_name: pi-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - frontend
    expose:
      - 8080
      - 11470
      - 12470
      - 5656
      - 8000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      # Grants the Homepage widget unauthenticated read access to a couple of
      # harmless routes (public IP, port-forward status) - see the file for details.
      - HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH=/gluetun/custom/auth-config.toml
    env_file:
      - path: ./config/gluetun/gluetun.env
        required: false
    volumes:
      - ${DATA_LOCATION:-./data}/gluetun:/gluetun
      - ./config/gluetun:/gluetun/custom:ro
    labels:
      - "homepage.group=Privacy"
      - "homepage.name=Gluetun"
      - "homepage.icon=gluetun.png"
      - "homepage.href=https://gluetun.${HOST_NAME:-pi.lan}"
      - "homepage.description=VPN client"
      - "homepage.widget.type=gluetun"
      - "homepage.widget.url=http://pi-gluetun:8000"
      - "homepage.widget.version=2"
