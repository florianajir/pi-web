x-service-defaults: &service-defaults
  logging:
    driver: "journald"
    options:
      tag: "{{.Name}}"
  restart: unless-stopped

x-cpu-request-tiny: &cpu-request-tiny
  resources:
    reservations:
      cpus: "0.05"

x-cpu-request-small: &cpu-request-small
  resources:
    reservations:
      cpus: "0.10"

x-cpu-request-medium: &cpu-request-medium
  resources:
    reservations:
      cpus: "0.20"

x-cpu-request-large: &cpu-request-large
  resources:
    reservations:
      cpus: "0.35"

x-cpu-request-xlarge: &cpu-request-xlarge
  resources:
    reservations:
      cpus: "0.60"

# OOM score adjustments: lower value = less likely to be killed
# Range: -1000 (never kill) to +1000 (kill first). Default is 0.
x-oom-score-critical: &oom-score-critical -1000
x-oom-score-important: &oom-score-important -500
x-oom-score-deprioritize: &oom-score-deprioritize 500

# Healthcheck timing presets (override individual fields as needed)
x-healthcheck-default: &healthcheck-default
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 20s

x-healthcheck-light: &healthcheck-light
  interval: 90s
  timeout: 10s
  retries: 2
  start_period: 10s

x-healthcheck-relaxed: &healthcheck-relaxed
  interval: 120s
  timeout: 10s
  retries: 2
  start_period: 10s

x-healthcheck-fast: &healthcheck-fast
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

services:
  ddns-updater:
    <<: *service-defaults
    image: ghcr.io/qdm12/ddns-updater:v2.10
    container_name: pi-ddns-updater
    environment:
      CONFIG: >-
        {"settings":[ {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"${HOST_NAME}","token":"${CLOUDFLARE_DNS_API_TOKEN}","ttl":1,"proxied":false}, {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"*.${HOST_NAME}","token":"${CLOUDFLARE_DNS_API_TOKEN}","ttl":1,"proxied":false} ]}
    volumes:
      - ddns_data:/updater/data
    deploy: *cpu-request-tiny
    mem_limit: 64m
    oom_score_adj: *oom-score-critical

  backrest:
    <<: *service-defaults
    build:
      context: ./config/backrest
      dockerfile: Dockerfile
    image: pi-backrest:local
    container_name: pi-backrest
    networks:
      - frontend
      - immich
      - ntfy
      - nextcloud
      - auth
    expose:
      - 9898
    environment:
      - BACKREST_PORT=0.0.0.0:9898
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/backrest/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=${TIMEZONE:-Europe/Paris}
      - HOST_NAME=${HOST_NAME:-pi.lan}
      - DB_HOST=postgres
      - DB_NAME=nextcloud
      - DB_USER=nextcloud
      - DB_PASSWORD=${PASSWORD}
      - NEXTCLOUD_CONFIG_FILE=/userdata/nextcloud-config/config.php
      - NEXTCLOUD_SQL_BACKUP_DIR=/userdata/nextcloud-config/backups
      - NEXTCLOUD_SQL_BACKUP_KEEP=${NEXTCLOUD_SQL_BACKUP_KEEP:-30}
      - NEXTCLOUD_HOOK_STATE_FILE=/tmp/nextcloud-maintenance.state
      - AUTHELIA_DB_NAME=authelia
      - AUTHELIA_DB_USER=authelia
      - AUTHELIA_DB_PASSWORD=${PASSWORD}
      - AUTHELIA_SQL_BACKUP_DIR=/userdata/authelia-config/backups
      - AUTHELIA_SQL_BACKUP_KEEP=7
      - LLDAP_DB_NAME=lldap
      - LLDAP_DB_USER=lldap
      - LLDAP_DB_PASSWORD=${PASSWORD}
      - LLDAP_SQL_BACKUP_DIR=/userdata/lldap/backups
      - LLDAP_SQL_BACKUP_KEEP=7
      - OPEN_WEBUI_DB_NAME=open-webui
      - OPEN_WEBUI_DB_USER=open-webui
      - OPEN_WEBUI_DB_PASSWORD=${PASSWORD}
      - OPEN_WEBUI_SQL_BACKUP_DIR=/userdata/open-webui/backups
      - OPEN_WEBUI_SQL_BACKUP_KEEP=7
      - VAULTWARDEN_DB_NAME=vaultwarden
      - VAULTWARDEN_DB_USER=vaultwarden
      - VAULTWARDEN_DB_PASSWORD=${PASSWORD}
      - VAULTWARDEN_SQL_BACKUP_DIR=/userdata/vaultwarden/backups
      - VAULTWARDEN_SQL_BACKUP_KEEP=7
      - RESTIC_PACK_SIZE=32
      - GOMEMLIMIT=1200MiB
    env_file:
      - path: ./config/ntfy/ntfy.env
        required: false
    extra_hosts:
      - "ntfy.${HOST_NAME:-pi.lan}:172.30.11.1"
    volumes:
      - ${DATA_LOCATION:-./data}/backrest/data:/data
      - ./config/backrest:/config/backrest
      - ${DATA_LOCATION:-./data}/backrest/repos:/repos
      - ${DATA_LOCATION:-./data}/immich:/userdata/immich:ro
      - ${DATA_LOCATION:-./data}/nextcloud:/userdata/nextcloud-data:ro
      - ${DATA_LOCATION:-./data}/nextcloud-config:/userdata/nextcloud-config
      - ${DATA_LOCATION:-./data}/nextcloud-themes:/userdata/nextcloud-themes:ro
      - ${DATA_LOCATION:-./data}/uptime-kuma:/userdata/uptime-kuma:ro
      - beszel_data:/userdata/beszel:ro
      - ${DATA_LOCATION:-./data}/lldap:/userdata/lldap:ro
      - ${DATA_LOCATION:-./data}/vaultwarden:/userdata/vaultwarden:ro
      # Writable so the db-backup.sh hook can drop its pg_dump here, like lldap's.
      - ${DATA_LOCATION:-./data}/vaultwarden/backups:/userdata/vaultwarden/backups
      - ${DATA_LOCATION:-./data}/lldap/backups:/userdata/lldap/backups
      - ${DATA_LOCATION:-./data}/authelia-config:/userdata/authelia-config
      - ${DATA_LOCATION:-./data}/open-webui/backups:/userdata/open-webui/backups
      - ./scripts/db-backup.sh:/hooks/db-backup.sh:ro
      - ./scripts/backrest-post-hook.sh:/hooks/backrest-post-hook.sh:ro
      - ./scripts/backrest-unlock.sh:/hooks/backrest-unlock.sh:ro
    tmpfs:
      - /cache
      - /tmp
    depends_on:
      immich-server:
        condition: service_healthy
      nextcloud:
        condition: service_healthy
      postgres:
        condition: service_healthy
      authelia:
        condition: service_healthy
    labels:
      - "homepage.group=Backup & Recovery"
      - "homepage.name=Backrest"
      - "homepage.icon=backrest.png"
      - "homepage.href=https://backrest.${HOST_NAME:-pi.lan}"
      - "homepage.description=Backup management"
      - "homepage.widget.type=backrest"
      - "homepage.widget.url=http://pi-backrest:9898"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.backrest.rule=Host(`backrest.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.backrest.entrypoints=websecure"
      - "traefik.http.routers.backrest.middlewares=lan@docker,authelia@docker"
      - "traefik.http.routers.backrest.tls=true"
      - "traefik.http.services.backrest.loadbalancer.server.port=9898"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-fsS", "http://localhost:9898/"]
      start_period: 45s
    deploy: *cpu-request-medium
    mem_limit: 1536m
    oom_score_adj: *oom-score-important

  traefik:
    <<: *service-defaults
    image: traefik:v3.7
    container_name: pi-traefik
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN:-}
    command:
      - "--log.level=INFO"
      - "--api.dashboard=true"
      - "--ping=true"
      # Entry Points
      - "--entrypoints.web.address=:80/tcp"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443/tcp"
      - "--entrypoints.websecure.http.middlewares=compress@docker,security-headers@docker"
      - "--entrypoints.websecure.http.tls.certresolver=cloudflare"
      - "--entrypoints.websecure.http3=true"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=${ALLOW_IP_RANGES:-127.0.0.1/32,192.168.1.0/24,100.64.0.0/10,172.30.0.0/16}"
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0"
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.watch=true"
      - "--providers.docker.network=frontend"
      - "--providers.docker.exposedbydefault=false"
      # ACME (Cloudflare DNS-01)
      - "--certificatesresolvers.cloudflare.acme.email=${EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=10"
    labels:
      - "homepage.group=Network"
      - "homepage.name=Traefik"
      - "homepage.icon=traefik.png"
      - "homepage.href=https://traefik.${HOST_NAME:-pi.lan}"
      - "homepage.description=Reverse proxy"
      - "homepage.widget.type=traefik"
      - "homepage.widget.url=http://pi-traefik:8080"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.middlewares.compress.compress=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=15552000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=same-origin"
      - "traefik.http.middlewares.lan.ipallowlist.sourcerange=${ALLOW_IP_RANGES:-127.0.0.1/32,192.168.1.0/24,100.64.0.0/10,172.30.0.0/16}"
      - "traefik.http.middlewares.rate-limit-auth.ratelimit.average=10"
      - "traefik.http.middlewares.rate-limit-auth.ratelimit.burst=20"
      - "traefik.http.middlewares.rate-limit-auth.ratelimit.period=1s"
      - "traefik.http.routers.traefik.middlewares=lan@docker,authelia@docker"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.domains[0].main=${HOST_NAME:-pi.lan}"
      - "traefik.http.routers.traefik.tls.domains[0].sans=*.${HOST_NAME:-pi.lan}"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      # Traefik auto-creates a default "traefik" entrypoint on :8080 (used by
      # --ping); attach api@internal to it too so Homepage can read the API
      # from inside the "frontend" network without going through the
      # Authelia-protected public dashboard router.
      - "traefik.http.routers.internalapi.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.internalapi.entrypoints=traefik"
      - "traefik.http.routers.internalapi.service=api@internal"
    ports:
      - "80:80"
      - "443:443"
    expose:
      - 8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_LOCATION:-./data}/traefik/letsencrypt:/letsencrypt
    networks:
      frontend:
        ipv4_address: 172.30.11.250
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      start_interval: 5s
    cpuset: "0"
    deploy: *cpu-request-medium
    mem_limit: 192m
    oom_score_adj: *oom-score-critical

  beszel:
    <<: *service-defaults
    image: henrygd/beszel:0.18.7
    container_name: pi-beszel
    networks:
      - frontend
    expose:
      - 8090
    environment:
      - APP_URL=https://beszel.${HOST_NAME:-pi.lan}
      - USER_EMAIL=${EMAIL}
      - USER_PASSWORD=${PASSWORD}
      - USER_CREATION=true
      - DISABLE_PASSWORD_AUTH=true
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      <<: *healthcheck-light
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      start_period: 5s
      start_interval: 3s
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=Beszel"
      - "homepage.icon=beszel.png"
      - "homepage.href=https://beszel.${HOST_NAME:-pi.lan}"
      - "homepage.description=System monitoring"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.beszel.rule=Host(`beszel.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.beszel.entrypoints=websecure"
      - "traefik.http.routers.beszel.middlewares=lan@docker"
      - "traefik.http.routers.beszel.tls=true"
      - "traefik.http.routers.beszel-agentconnect.rule=Host(`beszel.${HOST_NAME:-pi.lan}`) && PathPrefix(`/api/beszel/agent-connect`)"
      - "traefik.http.routers.beszel-agentconnect.entrypoints=websecure"
      - "traefik.http.routers.beszel-agentconnect.priority=100"
      - "traefik.http.routers.beszel-agentconnect.tls=true"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"
    deploy: *cpu-request-small
    mem_limit: 64m
    oom_score_adj: *oom-score-important

  beszel-agent:
    <<: *service-defaults
    build:
      context: ./config/beszel-agent
      dockerfile: Dockerfile
    image: pi-beszel-agent:local
    container_name: pi-beszel-agent
    depends_on:
      beszel:
        condition: service_healthy
      traefik:
        condition: service_healthy
    network_mode: host
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev:/dev
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      - /run/udev/data:/run/udev/data:ro
      - /proc:/host/proc:ro
      - /mnt/sdcard:/extra-filesystems/mmcblk0:ro,rslave
      - beszel_socket:/beszel_socket
      - beszel_agent_data:/var/lib/beszel-agent
    env_file:
      - path: ./config/beszel-agent/agent.env
        required: false
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: https://beszel.${HOST_NAME:-pi.lan}
      HOST_PROC: /host/proc
    healthcheck:
      <<: *healthcheck-light
      test: ["CMD", "/agent", "health"]
    deploy: *cpu-request-small
    mem_limit: 64m
    oom_score_adj: *oom-score-important

  uptime-kuma:
    <<: *service-defaults
    image: louislam/uptime-kuma:2
    container_name: pi-uptime-kuma
    networks:
      - frontend
      - ntfy
    expose:
      - 3001
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - APP_URL=https://uptime.${HOST_NAME:-pi.lan}
      - UPTIME_KUMA_DB_TYPE=sqlite
    env_file:
      - path: ./config/ntfy/ntfy.env
        required: false
    volumes:
      - ${DATA_LOCATION:-./data}/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=Uptime Kuma"
      - "homepage.icon=uptime-kuma.png"
      - "homepage.href=https://uptime.${HOST_NAME:-pi.lan}"
      - "homepage.description=Service uptime monitoring"
      - "homepage.widget.type=uptimekuma"
      - "homepage.widget.url=http://pi-uptime-kuma:3001"
      - "homepage.widget.slug=homepage"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.uptime-kuma.rule=Host(`uptime.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.middlewares=lan@docker,authelia@docker"
      - "traefik.http.routers.uptime-kuma.tls=true"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
    deploy: *cpu-request-small
    mem_limit: 256m
    oom_score_adj: *oom-score-important

  dockhand:
    <<: *service-defaults
    image: fnsys/dockhand:v1.0.42
    container_name: pi-dockhand
    networks:
      - frontend
    expose:
      - 3000
    environment:
      - TZ=${TIMEZONE:-Europe/Paris}
      - DISABLE_LOCAL_LOGIN=true
      - GOMEMLIMIT=160MiB
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dockhand_data:/app/data
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=Dockhand"
      - "homepage.icon=docker.png"
      - "homepage.href=https://dockhand.${HOST_NAME:-pi.lan}"
      - "homepage.description=Container management"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.dockhand.rule=Host(`dockhand.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.dockhand.entrypoints=websecure"
      - "traefik.http.routers.dockhand.middlewares=lan@docker"
      - "traefik.http.routers.dockhand.tls=true"
      - "traefik.http.services.dockhand.loadbalancer.server.port=3000"
    healthcheck:
      <<: *healthcheck-light
      test: ["CMD", "curl", "-fsSo", "/dev/null", "http://127.0.0.1:3000/api/auth/session"]
    deploy: *cpu-request-small
    mem_limit: 192m
    oom_score_adj: *oom-score-deprioritize

  unbound:
    <<: *service-defaults
    image: mvance/unbound-rpi:1.22.0
    container_name: pi-unbound
    networks:
      dns_internal:
        ipv4_address: 172.30.53.53
      dns_egress: {}
    expose:
      - 5335
    volumes:
      - ./config/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "drill", "@127.0.0.1", "-p", "5335", "cloudflare.com"]
      start_period: 10s
      start_interval: 5s
    deploy: *cpu-request-small
    mem_limit: 128m
    oom_score_adj: *oom-score-critical

  pihole:
    <<: *service-defaults
    image: pihole/pihole:2026.07.2
    container_name: pi-pihole
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    expose:
      - 53
      - 8082
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      TZ: ${TIMEZONE:-Europe/Paris}
      FTLCONF_webserver_api_password: ${PASSWORD:-admin}
      FTLCONF_dns_listeningMode: "all"
      # Unbound is primary; public resolvers are only used as failover if Unbound stops answering.
      FTLCONF_dns_upstreams: ${PIHOLE_DNS_UPSTREAMS:-172.30.53.53#5335;1.1.1.1;9.9.9.9}
      FTLCONF_misc_dnsmasq_lines: "address=/${HOST_NAME:-pi.lan}/${HOST_LAN_IP:-192.168.1.30}"
      FTLCONF_webserver_port: 8082
      FTLCONF_dns_domain_name: ${HOST_NAME:-pi.lan}
    volumes:
      - pihole_data:/etc/pihole
      - ./config/pihole/dnsmasq.d:/etc/dnsmasq.d
    networks:
      dns_internal: {}
      frontend: {}
      lan:
        ipv4_address: ${PIHOLE_IP:-192.168.1.250}
    depends_on:
      unbound:
        condition: service_healthy
    labels:
      - "homepage.group=Privacy"
      - "homepage.name=Pi-hole"
      - "homepage.icon=pi-hole.png"
      - "homepage.href=https://pihole.${HOST_NAME:-pi.lan}"
      - "homepage.description=DNS filtering"
      - "homepage.widget.type=pihole"
      - "homepage.widget.url=http://pi-pihole:8082"
      - "homepage.widget.version=6"
      - "homepage.widget.key={{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.pihole.rule=Host(`pihole.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.routers.pihole.middlewares=lan@docker,authelia@docker"
      - "traefik.http.services.pihole.loadbalancer.server.port=8082"
    cpuset: "0-1"
    deploy: *cpu-request-medium
    mem_limit: 192m
    oom_score_adj: *oom-score-critical

  n8n:
    <<: *service-defaults
    image: n8nio/n8n:2.35.3
    container_name: pi-n8n
    expose:
      - 5678
    labels:
      - "homepage.group=Automation"
      - "homepage.name=n8n"
      - "homepage.icon=n8n.png"
      - "homepage.href=https://n8n.${HOST_NAME:-pi.lan}"
      - "homepage.description=Workflow automation"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${HOST_NAME:-pi.lan}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.middlewares=lan@docker"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    environment:
      - N8N_HOST=n8n.${HOST_NAME:-pi.lan}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.${HOST_NAME:-pi.lan}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-${TIMEZONE:-Europe/Paris}}
      - TZ=${TIMEZONE:-Europe/Paris}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      - DB_TYPE=sqlite
      - DB_SQLITE_POOL_SIZE=2
      - N8N_EMAIL_MODE=smtp
      - N8N_SMTP_HOST=${SMTP_HOST:-localhost}
      - N8N_SMTP_PORT=${SMTP_PORT:-587}
      - N8N_SMTP_USER=${SMTP_USERNAME:-}
      - N8N_SMTP_PASS=${SMTP_PASSWORD:-}
      - N8N_SMTP_SENDER=${EMAIL:-noreply@localhost}
      - N8N_SMTP_SSL=${SMTP_SSL:-false}
      # Task runners (Python + JS via external sidecar)
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-n8n-runner-secret}
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - n8n_data:/home/node/.n8n
      - ${DATA_LOCATION:-./data}/n8n:/files
    networks:
      - frontend
      - n8n_runners
    depends_on:
      - traefik
    healthcheck:
      <<: *healthcheck-default
      # n8n listens internally on plain HTTP. Use explicit IPv4 loopback to avoid IPv6 (::1) resolution issues.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz"]
    deploy: *cpu-request-large
    mem_limit: 768m
    oom_score_adj: *oom-score-deprioritize

  n8n-runners:
    <<: *service-defaults
    image: n8nio/runners:2.35.3
    container_name: pi-n8n-runners
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-n8n-runner-secret}
    networks:
      - n8n_runners
    depends_on:
      - n8n
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5680/healthz && nc -z -w 2 n8n 5679"]
      start_period: 5s
      start_interval: 3s
    deploy: *cpu-request-small
    mem_limit: 256m
    oom_score_adj: *oom-score-deprioritize

  headplane:
    <<: *service-defaults
    image: ghcr.io/tale/headplane:0.7.0
    container_name: pi-headplane
    networks:
      - frontend
    extra_hosts:
      - "headscale.${HOST_NAME:-pi.lan}:172.30.11.1"
    expose:
      - 3000
    volumes:
      - ./config/headplane/config.yaml:/etc/headplane/config.yaml:ro
      - ./config/headscale:/etc/headscale:ro
      - ${DATA_LOCATION:-./data}/authelia-config/secrets/oidc_headplane_secret.txt:/run/secrets/oidc_headplane_secret:ro
      - ./config/headplane/headscale_api_key:/run/secrets/headplane_headscale_api_key:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - headplane_data:/var/lib/headplane
      - ./config/headplane/wasm/wasm_exec.js:/app/build/client/wasm_exec.js:ro
      - ./config/headplane/wasm/hp_ssh.wasm:/app/build/client/hp_ssh.wasm:ro
    environment:
      - NODE_OPTIONS=--max-old-space-size=160
      - HEADPLANE_HEADSCALE__URL=https://headscale.${HOST_NAME:-pi.lan}
      - HEADPLANE_OIDC__ISSUER=https://auth.${HOST_NAME:-pi.lan}
      - HEADPLANE_OIDC__CLIENT_ID=headplane
      - HEADPLANE_OIDC__CLIENT_SECRET_PATH=/run/secrets/oidc_headplane_secret
      - HEADPLANE_OIDC__TOKEN_ENDPOINT_AUTH_METHOD=client_secret_basic
      - HEADPLANE_OIDC__DISABLE_API_KEY_LOGIN=true
      - HEADPLANE_OIDC__HEADSCALE_API_KEY_PATH=/run/secrets/headplane_headscale_api_key
      - HEADPLANE_OIDC__SCOPE=openid email profile
    depends_on:
      - headscale
    labels:
      - "homepage.group=Network"
      - "homepage.name=Headplane"
      - "homepage.icon=headscale.png"
      - "homepage.href=https://headscale.${HOST_NAME:-pi.lan}/admin"
      - "homepage.description=Headscale administration"
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.headplane.rule=Host(`headscale.${HOST_NAME:-pi.lan}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.headplane.entrypoints=websecure"
      - "traefik.http.routers.headplane.middlewares=lan@docker,authelia@docker"
      - "traefik.http.routers.headplane.tls=true"
      - "traefik.http.routers.headplane.tls.certresolver=cloudflare"
      - "traefik.http.services.headplane.loadbalancer.server.port=3000"
      - "traefik.http.routers.headplane-wasm.rule=Host(`headscale.${HOST_NAME:-pi.lan}`) && (Path(`/wasm_exec.js`) || Path(`/hp_ssh.wasm`))"
      - "traefik.http.routers.headplane-wasm.entrypoints=websecure"
      - "traefik.http.routers.headplane-wasm.tls=true"
      - "traefik.http.routers.headplane-wasm.tls.certresolver=cloudflare"
      - "traefik.http.routers.headplane-wasm.service=headplane"
      - "traefik.http.routers.headplane-wasm.middlewares=wasm-path@docker"
      - "traefik.http.middlewares.wasm-path.replacepathregex.regex=/(wasm_exec.js|hp_ssh.wasm)"
      - "traefik.http.middlewares.wasm-path.replacepathregex.replacement=/admin/$$1"
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "/nodejs/bin/node", "-e", "const net=require('node:net');const s=net.connect({host:'127.0.0.1',port:3000},()=>{s.end();process.exit(0)});s.setTimeout(5000,()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"]
    deploy: *cpu-request-small
    mem_limit: 192m
    oom_score_adj: *oom-score-deprioritize

  # Network Stack
  headscale:
    <<: *service-defaults
    image: headscale/headscale:v0.29
    container_name: pi-headscale
    command: serve
    environment:
      - HEADSCALE_SERVER_URL=https://headscale.${HOST_NAME:-pi.lan}
