      test: ["CMD", "headscale", "health"]
      start_period: 10s
    cpuset: "0"
    deploy: *cpu-request-medium
    mem_limit: 128m
    oom_score_adj: *oom-score-critical

  tailscale:
    <<: *service-defaults
