name: CI

on:
  push:
    branches: [main, develop]
  # No base-branch filter: stacked PRs (a feature branch targeting another
  # feature branch) must run CI too.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  # Every static check lives in scripts/lint.sh, which `make lint` also runs:
  # a contributor's green run and a green CI run mean the same thing, and a
  # tightened rule cannot land in one without the other.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        # fetch-depth 0: the gitleaks gate scans history, and the default
        # shallow clone would hand it a single commit and report "no leaks".
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      # hadolint, actionlint and gitleaks are not installed: scripts/lint.sh
      # runs those from pinned images, so their versions are declared once and
      # apply to a local run too.
      #
      # ruff and yamllint come from requirements-lint.txt for the same reason:
      # unpinned, a linter release would redden pull requests that changed
      # nothing, and CI would stop agreeing with a contributor's `make lint`.
      # shellcheck is the runner image's apt version, which moves only when
      # GitHub bumps ubuntu-latest.
      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-lint.txt

      - name: Run every static check
        env:
          # A gate whose tool is missing is a silent hole in CI, so make it a
          # failure here even though a local run only reports it.
          LINT_STRICT: "1"
        run: make lint

  validate:
    name: Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Validate Docker Compose config
        env:
          DATA_LOCATION: /tmp/pi-pcloud-ci-data
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config >/dev/null
          # Validate with every per-service profile enabled too, so optional
          # services' definitions are checked even though they carry profiles.
          COMPOSE_PROFILES=all docker compose -f compose.yaml config >/dev/null
          # stremio-lan is deliberately outside "all" (it is the alternative to
          # stremio, never both), so the run above never renders it: without
          # this second one, a typo in its block would only fail for the user
          # who enables the profile.
          COMPOSE_PROFILES=stremio-lan docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.test.yaml config >/dev/null

  tests:
    name: Test Installer and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Runs install.sh's own functions against stubbed network detection and
      # a temporary .env, so the paths that decide what lands in .env are
      # covered without a LAN or any change to the host.
      - name: Run installer test suites
        run: make test

  smoke-test:
    name: Smoke Test Stack Startup
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    env:
      HOST_NAME: test.local
      ADMIN_USER: testuser
      EMAIL: test@example.com
      PASSWORD: testpassword123
      HOST_LAN_IP: 192.168.1.100
      TIMEZONE: UTC
      CLOUDFLARE_ZONE_ID: ci-zone-placeholder
      CLOUDFLARE_DNS_API_TOKEN: ci-token-placeholder
      COMPOSE_FILE: compose.yaml:compose.test.yaml
      # Explicit list, NOT "all": profile lists merge across compose files, and
      # compose.test.yaml marks CI-unfriendly services (gluetun, headscale,
      # backrest, ...) with the ci-excluded profile — "all" would re-enable
      # them. This list is every optional service except those and except
      # services depending on them (headplane needs headscale; the gluetun
      # tenants qbittorrent/stremio/kapowarr are out with gluetun), and
      # reproduces exactly the service set CI started before profiles existed.
      COMPOSE_PROFILES: >-
        beszel,uptime-kuma,dockhand,n8n,n8n-runners,immich-machine-learning,
        immich-server,nextcloud,comet,prowlarr,flaresolverr,kavita,
        shelfmark,audiobookshelf,vaultwarden,system-tools,open-webui
      COMPOSE_ANSI: never
      COMPOSE_REMOVE_ORPHANS: "1"
      COMPOSE_PROGRESS: quiet
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Create CI .env
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          HOST_NAME=test.local
          ADMIN_USER=admin
          EMAIL=test@example.com
          PASSWORD=testpassword123
          HOST_LAN_IP=192.168.1.100
          TIMEZONE=UTC
          CLOUDFLARE_ZONE_ID=ci-zone-placeholder
          CLOUDFLARE_DNS_API_TOKEN=ci-token-placeholder
          DATA_LOCATION=/tmp/pi-pcloud-ci-data
          EOF
          rm -rf /tmp/pi-pcloud-ci-data

      - name: Render generated configs for CI
        run: |
          set -euo pipefail
          sh ./scripts/authelia-pre-start.sh
          sh ./scripts/headscale-pre-start.sh
          # vaultwarden is in COMPOSE_PROFILES above, and its ADMIN_TOKEN digest is a
          # bind-mounted file: without this the daemon would create a directory there.
          sh ./scripts/vaultwarden-pre-start.sh
          # Renders config/shelfmark/shelfmark.env and the download destinations.
          # Its Prowlarr/qBittorrent blocks no-op here (neither has run yet), which
          # is the degraded path worth exercising.
          sh ./scripts/shelfmark-pre-start.sh
          # Creates audiobookshelf's /config and /metadata, and the audiobook
          # folder it shares with shelfmark.
          sh ./scripts/audiobookshelf-pre-start.sh

          # Make all generated files world-readable so docker compose (and the Docker
          # daemon) can open env_files regardless of the runner's umask or ownership.
          chmod -R a+rX /tmp/pi-pcloud-ci-data

          # Guard against bind-mount path type mismatches in CI
          test -f ./config/headplane/config.yaml
          test ! -d ./config/headplane/config.yaml
          test -f /tmp/pi-pcloud-ci-data/authelia-config/secrets/vaultwarden_admin_token_hash
          test ! -d /tmp/pi-pcloud-ci-data/authelia-config/secrets/vaultwarden_admin_token_hash
          test -f ./config/headscale/config.yaml
          test -f ./config/headscale/policy.hujson

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull images
        env:
          # Override the job-wide quiet progress so a failing pull names its image.
          COMPOSE_PROGRESS: plain
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker compose pull --ignore-buildable --policy missing; then
              exit 0
            fi
            delay=$((attempt * 20))
            echo "::warning::Pull attempt ${attempt}/3 failed; retrying in ${delay}s"
            sleep "${delay}"
          done
          echo "::error::Image pull failed after 3 attempts"
          exit 1

      - name: Start stack and run smoke checks
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 360 --pull missing --yes
          docker compose ps

          docker compose exec -T traefik \
            traefik healthcheck --ping >/dev/null
          code=""
          for _ in $(seq 1 12); do
            code="$(docker compose exec -T nextcloud \
              curl -sS -o /dev/null -w '%{http_code}' http://localhost/status.php | tr -d '\r\n')"
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              break
            fi
            sleep 5
          done
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "Unexpected Nextcloud status.php HTTP code after retries: $code" >&2
            exit 1
          fi
          docker compose exec -T immich-server \
            curl -fsS http://localhost:2283/api/server/ping >/dev/null

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --timestamps

      - name: Tear down stack
        if: always()
        run: |
          docker compose down -v
          sudo rm -rf /tmp/pi-pcloud-ci-data
