# Enable IP forwarding for Tailscale subnet routing/exit-node
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Prefer RAM over swap; the kernel default is 60.
vm.swappiness = 10

# Redis/Valkey fork-based persistence fails under low memory without overcommit.
vm.overcommit_memory = 1

# Socket buffer ceiling, for Unbound and for cloudflared's QUIC transport.
# 1 MB was enough for the DNS resolver, but quic-go asks for 7 MB and logs
# "failed to sufficiently increase receive buffer size" when it cannot have it,
# capping tunnel throughput. This is a maximum, not a default: nothing allocates
# more than it asks for, so raising it costs Unbound nothing.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000