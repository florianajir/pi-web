# Enable IP forwarding for Tailscale subnet routing/exit-node
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Prefer RAM over swap; the kernel default is 60.
vm.swappiness = 10

# Redis/Valkey fork-based persistence fails under low memory without overcommit.
vm.overcommit_memory = 1

# Socket buffer ceiling - a maximum, not a default: each socket still gets only
# what it asks for. Unbound asks for 1 MB (so-rcvbuf/so-sndbuf in
# config/unbound/unbound.conf); quic-go, inside cloudflared, asks for 7168 kiB
# and throttles the tunnel when refused, logging "failed to sufficiently
# increase receive buffer size". 7500000 is quic-go's own recommended value.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
