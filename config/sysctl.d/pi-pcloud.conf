# Enable IP forwarding for Tailscale subnet routing/exit-node
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Prefer RAM over swap; the kernel default is 60.
vm.swappiness = 10

# Redis/Valkey fork-based persistence fails under low memory without overcommit.
vm.overcommit_memory = 1

# Unbound: increase socket buffer sizes to 1 MB for DNS resolver performance
net.core.rmem_max = 1048576
net.core.wmem_max = 1048576