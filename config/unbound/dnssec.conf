# DNSSEC trust anchor for the production image (mvance/unbound-rpi), included by
# unbound.conf. It lives in its own file because compose.test.yaml runs a
# different image (klutchell/unbound, distroless) whose anchor ships at another
# path, and both images share this single unbound.conf.
#
# auto-, not a static trust-anchor-file, so RFC 5011 can roll the key: var/ is
# owned by _unbound, the user the daemon drops to, so it can rewrite the file.
  auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"
  val-clean-additional: yes
