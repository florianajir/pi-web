# Trust anchor for the production image. Separate from unbound.conf because CI
# runs a different image whose anchor ships elsewhere, and both share that file.
# auto-, so RFC 5011 can roll the key: var/ is owned by _unbound, the user the
# daemon drops to.
  auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"
  val-clean-additional: yes
