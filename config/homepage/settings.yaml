---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

# providers:
#   openweathermap: openweathermapapikey
#   weatherapi: weatherapiapikey

title: PI homepage
description: Personal self-hosted services dashboard

# No `favicon:` here on purpose. It is a valid setting (a path under /app/public),
# but homepage only applies it after hydration, from SettingsProvider - the browser
# has already taken its icon from the server-rendered <link>s by then. Setting it
# made the tab flicker: pi, then the browser's generic fallback once the swapped
# SVG failed to render. compose.yaml instead overrides the stock /favicon-*.png,
# /homepage.ico and /apple-touch-icon.png with the pi glyph, so it is correct in
# the very first HTML and never replaced.

layout:
  Favorites:
    header: false
    tab: Favorites
    style: row
    icon: mdi-star

  Services:
    header: false
    tab: Services
    style: row
    columns: 1
    icon: mdi-movie-open
    Storage:
      style: row
      columns: 1
      icon: mdi-database
    Security:
      style: row
      columns: 2
      icon: mdi-shield-key
    Download:
      style: row
      columns: 1
      icon: mdi-download
    Books:
      style: row
      columns: 2
      icon: mdi-book-open-page-variant
    Video:
      style: row
      columns: 2
      icon: mdi-video
    Tools:
      style: row
      columns: 2
      AI:
        header: false
      Automation:
        header: false
  Administration:
    header: false
    tab: Administration
    Notifications:
      header: false
      style: row
      columns: 1
    Backup & Recovery:
      header: false
      style: row
      columns: 1
    Monitoring:
      style: row
      columns: 3
      icon: mdi-monitor-dashboard
    Network:
      style: row
      columns: 4
      icon: mdi-network
    Authentication:
      style: row
      columns: 2
      icon: mdi-account-key
    Privacy:
      style: row
      columns: 2
      icon: mdi-domino-mask
    Dashboard:
